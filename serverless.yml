service: ms-tareas

# Se usa la v3 a proposito: la v4 exige una cuenta de serverless.com y un
# SERVERLESS_ACCESS_KEY para cada deploy. La v3 solo necesita credenciales
# de AWS, que es lo unico que da el Learner Lab.
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA: ${self:service}-tareas-${sls:stage}
  # AWS Academy no permite crear roles IAM: se reusa LabRole.
  # El rol necesita acceso a la tabla, a DynamoDB Streams y a SNS.
  # En una cuenta propia, borra la linea `role:` y descomenta los permisos,
  # que son los minimos que este microservicio necesita.
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
    # role:
    #   statements:
  #     - Effect: Allow
  #       Action:
  #         - sns:Publish
  #       Resource: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:Query
  #         - dynamodb:GetItem
  #         - dynamodb:PutItem
  #         - dynamodb:UpdateItem
  #       Resource:
  #         - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-tareas-${sls:stage}
  #         - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-tareas-${sls:stage}/index/*
  #
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"
    - "!src/**/__pycache__/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    # Por defecto se usa Docker, igual que en el repositorio del equipo.
    # El empaquetado local puede usar Python 3.12 con --param=dockerizePip=false.
    dockerizePip: ${strToBool(${param:dockerizePip, "true"})}
    slim: true
    # Cache propio por repo. El cache global de ~/.cache lo comparten todos
    # los servicios, y si dos despliegues corren a la vez un contenedor lo
    # deja en root:root mientras el otro lo lee -> EACCES.
    cacheLocation: ./.serverless-cache
  autorizador:
    # El authorizer vive en infra-compartida y lo comparten los 6 microservicios
    name: autorizadorCompartido
    type: request
    arn: ${cf:infra-compartida-${sls:stage}.AutorizadorArn}
    resultTtlInSeconds: 300
    identitySource: method.request.header.Authorization

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/health", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  listarTareas:
    handler: src/handlers/tareas.listar
    description: Tareas de un proyecto, filtrables por estado
    events:
      - http: { path: "/proyectos/{proyecto_id}/tareas", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  crearTarea:
    handler: src/handlers/tareas.crear
    description: Publica tarea.creada con los contadores del proyecto
    events:
      - http: { path: "/proyectos/{proyecto_id}/tareas", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  obtenerTarea:
    handler: src/handlers/tareas.obtener
    events:
      - http: { path: "/proyectos/{proyecto_id}/tareas/{tarea_id}", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  actualizarTarea:
    handler: src/handlers/tareas.actualizar
    events:
      - http: { path: "/proyectos/{proyecto_id}/tareas/{tarea_id}", method: put, cors: true, authorizer: "${self:custom.autorizador}" }

  completarTarea:
    handler: src/handlers/tareas.completar
    description: Publica tarea.completada - el evento clave de la demo
    events:
      - http: { path: "/proyectos/{proyecto_id}/tareas/{tarea_id}/completar", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  resumenProyecto:
    handler: src/handlers/tareas.resumen
    description: Contadores y avance de un proyecto
    events:
      - http: { path: "/proyectos/{proyecto_id}/resumen", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  misTareas:
    handler: src/handlers/tareas.mias
    description: Las tareas del usuario del token, por el GSI de responsable
    events:
      - http: { path: "/mis-tareas", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  publicarTareas:
    handler: src/handlers/publicar_tareas.manejar
    description: Publica a SNS los eventos de tareas confirmados en DynamoDB
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt Tabla.StreamArn
          startingPosition: TRIM_HORIZON
          functionResponseType: ReportBatchItemFailures
          filterPatterns:
            - dynamodb:
                NewImage:
                  evento_id:
                    S: [{ exists: true }]

resources:
  Resources:
    Tabla:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-tareas-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
        KeySchema:
          # pk = TENANT#<tenant_id>  -> el aislamiento vive en la particion
          - AttributeName: pk
            KeyType: HASH
          # sk = PROYECTO#<pid>#TAREA#<tid>  -> begins_with trae las tareas de
          # un proyecto, y #RESUMEN guarda los contadores atomicos
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          # "Mis tareas": un miembro no debe recorrer los 500 proyectos del
          # tenant para encontrar las 8 que le toca hacer.
          - IndexName: ix-responsable
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # ---------- CORS en las respuestas de ERROR ----------
    # API Gateway genera los 401/403 ANTES de llegar a la Lambda, y esas
    # respuestas no llevan cabeceras CORS. Desde el navegador un 401 se ve
    # entonces como un error de CORS, no como un 401: el frontend no puede
    # distinguir "tu sesion vencio" de "el servidor no responde".
    Cors401:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: UNAUTHORIZED
        StatusCode: "401"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors403:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: ACCESS_DENIED
        StatusCode: "403"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors4xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors5xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
