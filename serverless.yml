service: ms-tareas

frameworkVersion: "3"

provider:
  name: aws
  apiGateway:
    restApiId: ${cf:infra-compartida-${sls:stage}.ApiId}
    restApiRootResourceId: ${cf:infra-compartida-${sls:stage}.ApiRootResourceId}
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA: ${self:service}-tareas-${sls:stage}
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"
    - "!src/**/__pycache__/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: ${strToBool(${param:dockerizePip, "true"})}
    slim: true
    cacheLocation: ./.serverless-cache
  autorizador:
    type: CUSTOM
    authorizerId: ${cf:infra-compartida-${sls:stage}.AutorizadorApiId}

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/tareas/health", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  listarTareas:
    handler: src/handlers/tareas.listar
    description: Tareas de un proyecto, filtrables por estado
    events:
      - http: { path: "/tareas/proyectos/{proyecto_id}/tareas", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  crearTarea:
    handler: src/handlers/tareas.crear
    description: Publica tarea.creada con los contadores del proyecto
    events:
      - http: { path: "/tareas/proyectos/{proyecto_id}/tareas", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  obtenerTarea:
    handler: src/handlers/tareas.obtener
    events:
      - http: { path: "/tareas/proyectos/{proyecto_id}/tareas/{tarea_id}", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  actualizarTarea:
    handler: src/handlers/tareas.actualizar
    events:
      - http: { path: "/tareas/proyectos/{proyecto_id}/tareas/{tarea_id}", method: put, cors: true, authorizer: "${self:custom.autorizador}" }

  completarTarea:
    handler: src/handlers/tareas.completar
    description: Publica tarea.completada - el evento clave de la demo
    events:
      - http: { path: "/tareas/proyectos/{proyecto_id}/tareas/{tarea_id}/completar", method: post, cors: true, authorizer: "${self:custom.autorizador}" }

  resumenProyecto:
    handler: src/handlers/tareas.resumen
    description: Contadores y avance de un proyecto
    events:
      - http: { path: "/tareas/proyectos/{proyecto_id}/resumen", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  misTareas:
    handler: src/handlers/tareas.mias
    description: Las tareas del usuario del token, por el GSI de responsable
    events:
      - http: { path: "/tareas/mis-tareas", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  publicarTareas:
    handler: src/handlers/publicar_tareas.manejar
    description: Publica a SNS los eventos de tareas confirmados en DynamoDB
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt Tabla.StreamArn
          startingPosition: TRIM_HORIZON
          functionResponseType: ReportBatchItemFailures
          filterPatterns:
            - dynamodb:
                NewImage:
                  evento_id:
                    S: [{ exists: true }]

resources:
  Resources:
    Tabla:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-tareas-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ix-responsable
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

